{{define "content"}}
<section class="queue triage">
  <header class="triage-head">
    <p class="meta">
      <a href="/documents/{{.Document.ID}}">{{.Document.Heading}}</a>
      · {{.Counts.Untriaged}} of {{.Counts.Total}} left
    </p>
    <div class="triage-progress" role="presentation">
      <span style="width: {{pct (sub .Counts.Total .Counts.Untriaged) .Counts.Total}}%"></span>
    </div>
  </header>

  <article class="triage-card">
    {{if .Element.Chapter}}<h1 class="chapter-title">{{.Element.Chapter}}</h1>{{end}}
    <div class="triage-body">{{.Body}}</div>
    <p class="item-meta">
      {{if .Element.Page}}<span class="badge">p. {{.Element.Page}}</span>{{end}}
      {{if .Element.Color}}
        <span class="swatch" style="--swatch: {{.Element.Color}}" title="{{.Element.Color}}"></span>
      {{end}}
      <a class="source" href="/read/{{.Element.ID}}">open on its own</a>
    </p>
  </article>

  <!-- The same schedule panel the reader's own grading footer uses (see
       "schedule-buttons" in reader.html) — "keep" is meant to offer exactly
       the choices grading does, not a single fixed delay, so this is that
       same row wired to /elements/{id}/triage instead of /grade and /backlog:
       triage's "keep" must land in the same transaction as triaged_at (see
       Store.KeepTriaged) or a crash between the two would offer this
       passage again on the next pass despite it already being queued. -->
  <footer class="grades">
    <div class="grade-groups">
      <div class="grade-group">
        <span class="grade-label">Keep</span>
        <div class="grade-buttons schedule-buttons">
          <button hx-post="/elements/{{.Element.ID}}/triage"
                  hx-vals='{"decision":"keep","grade":"sooner"}'
                  title="Queue it, due back sooner than usual">
            Sooner<small>{{index .Intervals "sooner"}}</small>
          </button>
          {{range .Backlog}}
            <button class="preset"
                    hx-post="/elements/{{$.Element.ID}}/triage"
                    hx-vals="js:{decision: 'keep', days: {{.Days}}}"
                    title="Queue it, due back in {{.Label}}">
              {{.Label}}
            </button>
          {{end}}
          <button class="primary"
                  hx-post="/elements/{{.Element.ID}}/triage"
                  hx-vals='{"decision":"keep","grade":"next"}'
                  title="Queue it, due back on the normal interval">
            Next<small>{{index .Intervals "next"}}</small>
          </button>
        </div>
      </div>
    </div>

    <div class="grade-secondary">
      <button hx-post="/elements/{{.Element.ID}}/triage"
              hx-vals='{"decision":"suspend"}'
              title="Park it. It stays on the contents page and can be queued later.">
        Park<small>suspend</small>
      </button>
      <button hx-post="/elements/{{.Element.ID}}/triage"
              hx-vals='{"decision":"skip"}'
              title="Leave its schedule exactly as it is and move on.">
        Leave<small>as is</small>
      </button>
      <button class="danger" hx-post="/elements/{{.Element.ID}}/triage"
              hx-vals='{"decision":"drop"}'
              hx-confirm="Delete this annotation permanently?"
              title="Remove it altogether — a slipped highlight, or text that came out malformed.">
        Delete
      </button>
    </div>
  </footer>
</section>
{{end}}
