{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.Title}} · increader</title>
  <style>
    /* Deliberately inline and standalone: this layout is served to the
       watchOS Mail/Messages web viewer, which cannot be trusted to fetch a
       separate stylesheet reliably, and to any browser without JavaScript.
       No htmx, no MathJax, no nav bar — every control here is a plain
       <form> post. */
    :root {
      color-scheme: light dark;
      --bg: #fdfcfa; --fg: #1f1d1a; --muted: #6b6660;
      --rule: #e3ded6; --accent: #2f6f4e; --mark: #fdf0b8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --fg: #e8e4dc; --muted: #9a938a; --rule: #2f2c28; --accent: #7fb896; --mark: #4a4322; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 1rem/1.5 -apple-system, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main {
      padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
      max-width: 30rem; margin: 0 auto;
    }
    h1 { font-size: 1.25rem; margin: 0; line-height: 1.3; }
    a { color: var(--accent); }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; margin-bottom: 0.9rem; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .item {
      display: block; padding: 0.85rem 0; border-bottom: 1px solid var(--rule);
      text-decoration: none; color: inherit;
    }
    .item:last-child { border-bottom: 0; }
    .item-title { font-weight: 600; display: block; }
    .item-meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
    .empty { color: var(--muted); padding: 2.5rem 0; text-align: center; }
    .article { margin: 1rem 0; font-size: 1.05rem; line-height: 1.6; }
    .article p { margin: 0 0 0.85rem; }
    .article mark { background: var(--mark); }
    form.grade { margin: 0.5rem 0; }
    button {
      display: block; width: 100%; padding: 0.85rem; margin: 0;
      font-size: 1rem; border-radius: 10px; border: 1px solid var(--rule);
      background: transparent; color: var(--fg);
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button small { display: block; font-size: 0.78rem; opacity: 0.8; font-weight: normal; }
    .back { display: block; margin-top: 1.25rem; text-align: center; }
  </style>
</head>
<body>
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
