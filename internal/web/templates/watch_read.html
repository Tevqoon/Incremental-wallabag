{{define "content"}}
<div class="top">
  <h1>{{.Title}}</h1>
</div>

<div class="article">{{.ArticleHTML}}</div>

<form class="grade" method="post" action="/elements/{{.Element.ID}}/grade">
  <input type="hidden" name="redirect" value="/w/next">
  <button class="primary" name="grade" value="done">
    Done<small>{{if .Element.IsRoot}}archive{{else}}finish{{end}}</small>
  </button>
</form>
<form class="grade" method="post" action="/elements/{{.Element.ID}}/grade">
  <input type="hidden" name="redirect" value="/w/next">
  <button name="grade" value="bury">Later<small>today</small></button>
</form>
<form class="grade" method="post" action="/elements/{{.Element.ID}}/grade">
  <input type="hidden" name="redirect" value="/w/next">
  <button name="grade" value="sooner">Sooner<small>{{index .Intervals "sooner"}}</small></button>
</form>
<form class="grade" method="post" action="/elements/{{.Element.ID}}/grade">
  <input type="hidden" name="redirect" value="/w/next">
  <button name="grade" value="next">Next<small>{{index .Intervals "next"}}</small></button>
</form>

<a class="back" href="/w">&larr; back to queue</a>
{{end}}
