{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-bottom) resolve
       to something other than 0 on iOS — see the reader's .grades bar in
       app.css, which is pinned to the screen's bottom edge for nearly the
       entire time an article is open and needs that inset to stay clear of
       the home indicator and Safari's own collapsing toolbar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.Title}} · increader</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- Blocking, not deferred, and ahead of the stylesheet: a stored theme
       override has to land on <html> before the first paint, or the
       device's own theme flashes for one frame before this corrects it.
       app.js (deferred) only wires up the toggle button afterwards; by the
       time it runs the theme itself is already settled. -->
  <script>
    (function () {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    })();
  </script>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">increader</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/queue?kind=articles">Queue</a>
      <a href="/next?kind=articles">Read next</a>
      <a href="/queue?kind=extracts">Review</a>
      <a href="/extracts">Extracts</a>
      <a href="/library">Library</a>
      <a href="/import">Import</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" title="Cycle the color theme: device, light, dark"></button>
  </header>

  <main>
    {{template "content" .}}

    <!-- Inside main, not after it, purely for the last moment of scrolling:
         the reader's grading bar (.grades) is sticky within main, and stays
         pinned to the screen's bottom edge for nearly the whole time an
         article is open. Right at the true end, it settles into its normal
         resting place; anything scrollable past main's own end at that exact
         moment is one more thing that transition could catch on. Keeping
         this inside main means there is nothing left outside it to catch
         on. -->
    <footer class="build" title="the running build, so a stale container is visible">
      {{build}}
    </footer>
  </main>
</body>
</html>{{end}}
