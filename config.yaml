# increader configuration.
#
# ${VAR} references are replaced with environment variables at load time, so
# this file carries no secrets and is safe to commit. Only the braced form is
# substituted — a bare $ is left alone, since passwords contain them.

# Listen address. 0.0.0.0 is correct inside a container: 127.0.0.1 there is the
# container's own loopback and would be unreachable. Exposure is controlled by
# the port mapping in compose.yaml, which currently publishes on all host
# interfaces (LAN/Tailscale-reachable, not just loopback) — see the comment
# there. The app has no auth, so treat that binding as the real perimeter.
bind: 0.0.0.0:8080

# Path to the SQLite database. Under compose this is the mounted volume.
database: /data/increader.db

# Decides what "today" means. Scheduling works in whole days, so this
# determines when material becomes due.
timezone: Europe/Ljubljana

# How often sources are polled in the background.
sync_interval: 30m

# Maximum rows the queue page renders at once, per queue. 0 means all of them,
# which is the default.
#
# Purely a display cap: "Read next" and every grade always jump to the single
# most important due element, so this has never limited how much you can read
# in a day — only how much of the list you can see at once. Worth setting only
# if a very large backlog makes the page unwieldy; when it does truncate, the
# page says so rather than quietly showing you a fraction.
queue_page_limit: 0

# How long before a passage pulled out while reading first comes back.
# Putting one straight back in front of you defeats the point; the value of an
# extract is re-reading it once the article has faded. Lightly fuzzed a few
# days either way so pulling several passages from one article in a sitting
# does not put them all back on the same date.
#
# Only for extracts made by hand — annotations arriving in bulk (a wallabag
# sync, a book import) use the two settings below instead.
extract_delay_days: 10

# How annotations imported in bulk are scheduled: annotation_delay_days is the
# fewest days ahead one can first become due, annotation_delay_spread_days is
# how much further out on top of that it might land — the two together give a
# 30-to-90-day range by default. Applies to a wallabag sync's highlights and to
# an uploaded book or PDF's annotations when queued outright (skipping the
# triage pass — see the README's "Books and papers" section).
#
# The floor exists because a highlight from months or years of a library
# arriving all at once should not immediately compete with what you are
# actually reading. The spread exists for serendipity: without it, everything
# from one sync or one book would surface within days of each other rather
# than turning up unpredictably, spread thin, over the following couple of
# months — and a spread that is not seeded per annotation reproduces the same
# problem in a different form, landing every highlight from one document on
# the exact same day regardless of how wide the window is.
annotation_delay_days: 30
annotation_delay_spread_days: 60

sources:
  wallabag:
    # The official hosted instance. Use your own base URL if self-hosting.
    url: https://app.wallabag.it

    # From the wallabag web UI:
    #   Settings -> API clients management -> Create a new client
    client_id: ${WALLABAG_CLIENT_ID}
    client_secret: ${WALLABAG_CLIENT_SECRET}
    username: ${WALLABAG_USERNAME}
    password: ${WALLABAG_PASSWORD}

# One-shot, operator-run importer — deliberately not nested under sources:
# above. A sources: entry is polled on sync_interval and carries a watermark
# in the database; this is not. Substack has no "changed since" listing,
# only a fixed archive walked by hand while a subscription happens to be
# active, so putting it under sources: would imply a background sync that
# does not exist. Run with:
#   increader import-substack            (dry run: reports only, writes nothing)
#   increader import-substack -commit    (applies the plan the dry run printed)
#
# Commented out entirely by default, not just secret-free: host and
# session_cookie must be set together or not at all — Load treats a host
# with no cookie as a hard error, on the theory that an importer which only
# fails once you actually run it is worse than one that refuses to load. A
# real host here with SUBSTACK_SID unset would trip that error for every
# operator who has no interest in Substack. Uncomment the whole block below
# and fill in host to use it.
#
# ingest:
#   substack:
#     # The publication's own domain, or a custom domain it has mapped onto
#     # Substack.
#     host: example.substack.com
#
#     # The substack.sid cookie from a browser signed into an account with
#     # an active paid subscription to host, above.
#     #
#     # IMPORTANT: the value legitimately begins with "s%3A" (the
#     # URL-escaped form of "s:") — that prefix is part of the cookie
#     # itself, not URL-escaping applied on top of it. Paste it in whole;
#     # stripping the "s%3A" produces a cookie substack will not recognise.
#     #
#     # Also note the ${...} substitution below only recognises the braced
#     # form — a bare $SUBSTACK_SID would be left completely alone rather
#     # than substituted, per the file header above.
#     #
#     # To find it in Safari: Settings -> Advanced -> "Show features for web
#     # developers", then with a Substack page open, Develop -> Show Web
#     # Inspector -> Storage -> Cookies.
#     session_cookie: ${SUBSTACK_SID}
#
#     # Where fetched posts are cached between runs, so a later run made
#     # after the subscription has lapsed again can skip re-fetching
#     # anything already captured while it was active. Defaults to
#     # ./substack-cache when left unset.
#     # cache_dir: ./substack-cache
#
#     # Applied to every document this importer hands to wallabag, so a
#     # backfilled post is easy to find afterward. Defaults to the
#     # publication's own subdomain (the first label of host, above) when
#     # left unset.
#     # tag: example
